<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful – YachtCoreOS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }<script defer src="/_vercel/insights/script.js"></script>
    
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
    }

    .success-icon {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #0f766e, #14b8a6);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
      font-size: 36px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #0f766e, #0d9488);
      color: white;
      text-decoration: none;
      padding: 16px 32px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 14px rgba(15, 118, 110, 0.4);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(15, 118, 110, 0.5);
      filter: brightness(1.1);
    }

    .secondary {
      margin-top: 24px;
      font-size: 14px;
      color: #64748b;
    }

    .secondary a {
      color: #38bdf8;
      text-decoration: none;
    }

    .secondary a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="success-icon">✓</div>
    
    <h1>Payment Successful</h1>
    
    <p class="subtitle">
      Thank you for your purchase.<br>
      Your access to the Stew-Captain Inquiry Form is now ready.
    </p>

    <!-- 
      IMPORTANT: Replace the href below with the correct form URL
      Examples:
      - Short Captain form (button version)
      - Or the long form if that's the one you want to use for now
    -->
    <a href="stew-inquiry-full.html" class="btn">Open Stew-Captain Form →
    </a>

    <p class="secondary">
      Need help? Contact us at 
      <a href="mailto:yachtcoreconnect@yachtcoreos.com">yachtcoreconnect@yachtcoreos.com</a>
    </p>
  </div>
</body>
</html>
