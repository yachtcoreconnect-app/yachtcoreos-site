<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crew Rotation Preview | YachtOps Toolkit</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;padding:20px}
.wrap{max-width:520px;margin:40px auto}
a.back{color:#94a3b8;text-decoration:none;font-size:14px;display:inline-block;margin-bottom:24px}
.card{background:rgba(30,41,59,.8);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:32px}
h1{font-size:24px;color:#f1f5f9;margin-bottom:6px}
.sub{color:#94a3b8;font-size:14px;margin-bottom:28px}
label{display:block;font-size:13px;color:#94a3b8;margin:16px 0 6px}
input,select{width:100%;background:rgba(15,23,42,.8);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:12px 14px;color:#f1f5f9;font-size:16px}
button{width:100%;margin-top:28px;background:#0f766e;color:#fff;border:none;padding:14px;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer}
.result{margin-top:28px;padding:20px;background:rgba(15,118,110,.15);border:1px solid rgba(20,184,166,.3);border-radius:12px;display:none}
.result h3{color:#5eead4;font-size:14px;margin-bottom:12px}
.result-row{display:flex;justify-content:space-between;margin-bottom:8px;font-size:15px}
.result-row span:last-child{font-weight:600;color:#f1f5f9}
.note{margin-top:16px;font-size:12px;color:#64748b}
</style>
</head><script defer src="/_vercel/insights/script.js"></script>
<body>
<div class="wrap">
<a href="/" class="back">← Back to Toolkit</a>
<div class="card">
<h1>👥 Crew Rotation Preview</h1>
<p class="sub">Simple on/off rotation estimate.</p>
<label>Total crew members</label>
<input type="number" id="crew" placeholder="e.g. 8" min="1">
<label>Weeks on</label>
<input type="number" id="on" placeholder="e.g. 8" min="1">
<label>Weeks off</label>
<input type="number" id="off" placeholder="e.g. 4" min="1">
<button onclick="calc()">Calculate</button>
<div class="result" id="result">
<h3>Rotation preview</h3>
<div class="result-row"><span>Cycle length</span><span id="cycle">—</span></div>
<div class="result-row"><span>Onboard at a time (approx.)</span><span id="onboard">—</span></div>
<div class="result-row"><span>Off at a time (approx.)</span><span id="offboard">—</span></div>
<p class="note">Rough preview only. Real schedules depend on roles and vessel needs.</p>
</div>
</div>
</div>
<script>
function calc(){
const C=+document.getElementById('crew').value||0;
const On=+document.getElementById('on').value||0;
const Off=+document.getElementById('off').value||0;
if(C<=0||On<=0||Off<=0){alert('Please fill all fields.');return}
const cycle=On+Off;
const onboard=Math.round(C*(On/cycle));
const offboard=C-onboard;
document.getElementById('cycle').textContent=cycle+' weeks';
document.getElementById('onboard').textContent=onboard+' people';
document.getElementById('offboard').textContent=offboard+' people';
document.getElementById('result').style.display='block';
}
</script>
</body>
</html>
